<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Atmos Weather</title>
  <meta name="theme-color" content="#0a162e" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%231e3a8a'/%3E%3Cstop offset='100%25' stop-color='%230ea5e9'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='128' height='128' rx='28' fill='url(%23g)'/%3E%3Ccircle cx='52' cy='50' r='20' fill='%23fde047'/%3E%3Cpath d='M36 82h52a16 16 0 0 0 2-31.9A22 22 0 0 0 47.4 45 17 17 0 0 0 36 82Z' fill='%23f8fafc'/%3E%3Ccircle cx='46' cy='96' r='4' fill='%23bae6fd'/%3E%3Ccircle cx='64' cy='101' r='4' fill='%23ffffff'/%3E%3Ccircle cx='82' cy='96' r='4' fill='%23bae6fd'/%3E%3C/svg%3E" />
  <style>
    :root {
      --bg-top: #091734;
      --bg-mid: #143263;
      --bg-bot: #071124;
      --glass: rgba(255, 255, 255, 0.11);
      --glass-border: rgba(255, 255, 255, 0.19);
      --text-main: #f8fafc;
      --text-muted: rgba(226, 232, 240, 0.78);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "SamsungOne", "Roboto", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text-main);
      background: #050b17;
      user-select: none;
    }

    .widget {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: max(14px, env(safe-area-inset-top)) max(15px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(15px, env(safe-area-inset-left));
      background: radial-gradient(circle at 85% 12%, rgba(125, 211, 252, 0.18), transparent 45%),
                  linear-gradient(155deg, var(--bg-top) 0%, var(--bg-mid) 52%, var(--bg-bot) 100%);
      transition: background 0.8s ease;
      overflow: hidden;
    }

    .widget::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.24);
      z-index: 3;
    }

    #fxCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      gap: 10px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .loc-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      padding: 6px 11px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      max-width: 68%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .loc-btn:active { transform: scale(0.97); }

    .controls-mini {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pill-btn {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .pill-btn:active { transform: scale(0.95); }

    .hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .temp-wrap { display: flex; flex-direction: column; }

    .temp-row {
      display: flex;
      align-items: flex-start;
      line-height: 0.9;
    }

    .temp-val {
      font-size: clamp(46px, 14vw, 76px);
      font-weight: 700;
      letter-spacing: -0.04em;
      text-shadow: 0 6px 24px rgba(0, 0, 0, 0.34);
    }

    .temp-deg {
      font-size: clamp(20px, 5.5vw, 30px);
      font-weight: 500;
      margin-top: 5px;
      opacity: 0.9;
    }

    .cond-label {
      margin-top: 6px;
      font-size: clamp(14px, 3.8vw, 18px);
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .sub-meta {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .hero-icon {
      width: clamp(58px, 17vw, 88px);
      height: clamp(58px, 17vw, 88px);
      flex-shrink: 0;
      filter: drop-shadow(0 10px 22px rgba(0, 0, 0, 0.32));
      animation: floatIcon 4s ease-in-out infinite;
    }

    @keyframes floatIcon {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }

    .precip-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .p-card {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      padding: 11px 13px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .p-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .p-val-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 6px;
    }

    .p-pct {
      font-size: clamp(22px, 6.2vw, 30px);
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .p-amt {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .bar-track {
      width: 100%;
      height: 7px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.75s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .bar-rain {
      background: linear-gradient(90deg, #0284c7, #38bdf8, #7dd3fc);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.55);
    }

    .bar-snow {
      background: linear-gradient(90deg, #93c5fd, #e0f2fe, #ffffff);
      box-shadow: 0 0 12px rgba(224, 242, 254, 0.6);
    }

    .chart-card {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      padding: 11px 13px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
      min-height: 106px;
      max-height: 190px;
    }

    .chart-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--text-muted);
    }

    .chart-legend {
      display: flex;
      gap: 10px;
      align-items: center;
      font-size: 10.5px;
      font-weight: 600;
    }

    .dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      margin-right: 4px;
    }

    .bars-wrap {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 4px;
      align-items: end;
      flex: 1;
      min-height: 54px;
    }

    .h-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      height: 100%;
      gap: 4px;
      cursor: pointer;
      padding: 3px 0;
      border-radius: 8px;
      transition: background 0.15s;
    }

    .h-col.active { background: rgba(255, 255, 255, 0.15); }
    .h-temp { font-size: 10px; font-weight: 600; opacity: 0.92; }

    .h-bar-box {
      width: 100%;
      max-width: 14px;
      flex: 1;
      min-height: 24px;
      background: rgba(255, 255, 255, 0.09);
      border-radius: 999px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      overflow: hidden;
    }

    .h-bar-snow {
      width: 100%;
      background: linear-gradient(180deg, #ffffff, #bae6fd);
      transition: height 0.5s ease;
    }

    .h-bar-rain {
      width: 100%;
      background: linear-gradient(180deg, #38bdf8, #0284c7);
      transition: height 0.5s ease;
    }

    .h-time { font-size: 9.5px; color: var(--text-muted); }

    .inspector {
      font-size: 11.5px;
      color: var(--text-main);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 4px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
    }

    @media (max-height: 265px) {
      .chart-card { display: none; }
      .sub-meta { display: none; }
    }
    @media (max-height: 195px) {
      .widget { padding: 10px 12px; }
      .precip-grid { gap: 6px; }
      .p-card { padding: 7px 9px; gap: 3px; border-radius: 14px; }
      .bar-track { display: none; }
    }
    @media (max-width: 245px) {
      .hero-icon { width: 44px; height: 44px; }
      .p-amt { display: none; }
    }

    .modal-bg {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: rgba(5, 10, 22, 0.78);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-bg.open { display: flex; }

    .modal {
      width: 100%;
      max-width: 350px;
      background: rgba(15, 23, 42, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 11px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
    }

    .modal h3 {
      font-size: 16px;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .search-row { display: flex; gap: 6px; }

    .search-input {
      flex: 1;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      border-radius: 14px;
      padding: 10px 12px;
      font-size: 14px;
      outline: none;
    }

    .btn-primary {
      background: #0284c7;
      border: none;
      color: #fff;
      border-radius: 14px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .results {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 155px;
      overflow-y: auto;
    }

    .res-item {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      text-align: left;
      padding: 9px 12px;
      border-radius: 12px;
      font-size: 13px;
      cursor: pointer;
    }

    .scene-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      font-weight: 700;
      padding-top: 4px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
    }

    .scene-row { display: flex; flex-wrap: wrap; gap: 6px; }

    .chip {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #e2e8f0;
      border-radius: 999px;
      padding: 6px 11px;
      font-size: 12px;
      cursor: pointer;
    }

    .chip.active {
      background: #0ea5e9;
      border-color: #38bdf8;
      color: #fff;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="widget" id="widgetRoot">
    <canvas id="fxCanvas"></canvas>

    <div class="content">
      <header class="top-bar">
        <button class="loc-btn" id="openSettings" title="Change city or preview scene">
          <span>📍</span>
          <span id="cityName">Locating...</span>
        </button>
        <div class="controls-mini">
          <button class="pill-btn" id="refreshBtn" title="Refresh weather">↻</button>
          <button class="pill-btn" id="unitBtn" title="Switch °F / °C">°F</button>
        </div>
      </header>

      <section class="hero">
        <div class="temp-wrap">
          <div class="temp-row">
            <span class="temp-val" id="tempVal">--</span>
            <span class="temp-deg" id="tempDeg">°F</span>
          </div>
          <div class="cond-label" id="condLabel">Loading forecast...</div>
          <div class="sub-meta" id="subMeta">Feels -- · Wind --</div>
        </div>
        <div class="hero-icon" id="heroIcon"></div>
      </section>

      <section class="precip-grid">
        <div class="p-card">
          <div class="p-head"><span>Rain Chance</span><span>🌧️</span></div>
          <div class="p-val-row">
            <span class="p-pct" id="rainPct">0%</span>
            <span class="p-amt" id="rainAmt">0.00 in</span>
          </div>
          <div class="bar-track"><div class="bar-fill bar-rain" id="rainBar" style="width: 0%"></div></div>
        </div>

        <div class="p-card">
          <div class="p-head"><span>Snow Chance</span><span>❄️</span></div>
          <div class="p-val-row">
            <span class="p-pct" id="snowPct">0%</span>
            <span class="p-amt" id="snowAmt">0.0 in</span>
          </div>
          <div class="bar-track"><div class="bar-fill bar-snow" id="snowBar" style="width: 0%"></div></div>
        </div>
      </section>

      <section class="chart-card">
        <div class="chart-head">
          <span>NEXT 12 HOURS</span>
          <div class="chart-legend">
            <span><i class="dot" style="background:#38bdf8"></i>Rain</span>
            <span><i class="dot" style="background:#ffffff"></i>Snow</span>
          </div>
        </div>
        <div class="bars-wrap" id="barsWrap"></div>
        <div class="inspector" id="inspector">
          <span>Tap any hour to inspect rain &amp; snow</span>
          <span id="updatedAt">--:--</span>
        </div>
      </section>
    </div>
  </main>

  <div class="modal-bg" id="modalBg">
    <div class="modal">
      <h3>
        <span>Location &amp; Graphics</span>
        <button class="pill-btn" id="closeModal">✕</button>
      </h3>
      <div class="search-row">
        <input class="search-input" id="cityInput" placeholder="Search city (e.g. Chicago, Denver)" />
        <button class="btn-primary" id="searchBtn">Go</button>
      </div>
      <button class="res-item" id="gpsBtn">🎯 Use GPS / Auto-Detect My Location</button>
      <div class="results" id="searchResults"></div>
      <div class="scene-title">Live / Scene Preview</div>
      <div class="scene-row" id="sceneChips">
        <button class="chip active" data-scene="live">Live Data</button>
        <button class="chip" data-scene="snow">Heavy Snow</button>
        <button class="chip" data-scene="rain">Rainstorm</button>
        <button class="chip" data-scene="mix">Wintry Mix</button>
        <button class="chip" data-scene="night">Starry Night</button>
        <button class="chip" data-scene="sunny">Crisp Sunny</button>
      </div>
    </div>
  </div>

  <script>
    const savedCity = localStorage.getItem('atmos_city');
    const savedLat = parseFloat(localStorage.getItem('atmos_lat'));
    const savedLon = parseFloat(localStorage.getItem('atmos_lon'));

    const state = {
      unit: localStorage.getItem('atmos_unit') || 'F',
      city: savedCity || '',
      lat: Number.isFinite(savedLat) ? savedLat : 41.0793,
      lon: Number.isFinite(savedLon) ? savedLon : -85.1394,
      sceneOverride: 'live',
      data: null,
      activeHour: 0,
      fxMode: 'cloudy',
      particles: [],
      running: true
    };

    const THEMES = {
      snow:   ['#0f2347', '#254a82', '#0b1830'],
      rain:   ['#09172e', '#163859', '#071121'],
      mix:    ['#152142', '#2b406e', '#0d162c'],
      sunny:  ['#0369a1', '#0284c7', '#0a3f61'],
      night:  ['#040814', '#0e1d42', '#050b1c'],
      cloudy: ['#1c2738', '#314158', '#0e1624']
    };

    const WMO = {
      0: ['Clear Sky', 'sunny'],
      1: ['Mostly Clear', 'sunny'],
      2: ['Partly Cloudy', 'cloudy'],
      3: ['Overcast', 'cloudy'],
      45: ['Foggy', 'cloudy'],
      48: ['Freezing Fog', 'snow'],
      51: ['Light Drizzle', 'rain'],
      53: ['Drizzle', 'rain'],
      55: ['Dense Drizzle', 'rain'],
      56: ['Freezing Drizzle', 'mix'],
      57: ['Freezing Rain', 'mix'],
      61: ['Light Rain', 'rain'],
      63: ['Moderate Rain', 'rain'],
      65: ['Heavy Rain', 'rain'],
      66: ['Freezing Rain', 'mix'],
      67: ['Heavy Freezing Rain', 'mix'],
      71: ['Light Snow', 'snow'],
      73: ['Moderate Snow', 'snow'],
      75: ['Heavy Snow', 'snow'],
      77: ['Snow Grains', 'snow'],
      80: ['Rain Showers', 'rain'],
      81: ['Heavy Showers', 'rain'],
      82: ['Downpour', 'rain'],
      85: ['Snow Showers', 'snow'],
      86: ['Heavy Snow Showers', 'snow'],
      95: ['Thunderstorm', 'rain'],
      96: ['Storm & Hail', 'mix'],
      99: ['Severe Storm', 'mix']
    };

    const $ = (id) => document.getElementById(id);

    function toDisplayTemp(c) {
      return state.unit === 'F' ? Math.round(c * 9 / 5 + 32) : Math.round(c);
    }
    function fmtRain(mm) {
      return state.unit === 'F' ? (mm / 25.4).toFixed(2) + ' in' : mm.toFixed(1) + ' mm';
    }
    function fmtSnow(cm) {
      return state.unit === 'F' ? (cm / 2.54).toFixed(1) + ' in' : cm.toFixed(1) + ' cm';
    }
    function fmtWind(kmh) {
      return state.unit === 'F' ? Math.round(kmh * 0.621371) + ' mph' : Math.round(kmh) + ' km/h';
    }

    function iconSVG(mode) {
      if (mode === 'snow') {
        return `<svg viewBox="0 0 80 80" fill="none">
          <path d="M22 46h36a11 11 0 0 0 1.4-21.9A15 15 0 0 0 30.2 21 12 12 0 0 0 22 46Z" fill="url(#c1)"/>
          <g fill="#e0f2fe">
            <circle cx="28" cy="56" r="3.3"/><circle cx="40" cy="61" r="3.7"/><circle cx="52" cy="56" r="3.3"/>
            <circle cx="34" cy="68" r="2.4"/><circle cx="47" cy="68" r="2.4"/>
          </g>
          <defs><linearGradient id="c1" x1="20" y1="16" x2="58" y2="48" gradientUnits="userSpaceOnUse">
            <stop stop-color="#fff"/><stop offset="1" stop-color="#cbd5e1"/>
          </linearGradient></defs></svg>`;
      }
      if (mode === 'rain') {
        return `<svg viewBox="0 0 80 80" fill="none">
          <path d="M22 45h36a11 11 0 0 0 1.4-21.9A15 15 0 0 0 30.2 20 12 12 0 0 0 22 45Z" fill="#e2e8f0"/>
          <path d="M29 53l-3 10M41 53l-3 12M53 53l-3 10" stroke="#38bdf8" stroke-width="3.6" stroke-linecap="round"/>
        </svg>`;
      }
      if (mode === 'mix') {
        return `<svg viewBox="0 0 80 80" fill="none">
          <path d="M22 45h36a11 11 0 0 0 1.4-21.9A15 15 0 0 0 30.2 20 12 12 0 0 0 22 45Z" fill="#e2e8f0"/>
          <path d="M30 53l-3 10M48 53l-3 10" stroke="#38bdf8" stroke-width="3.4" stroke-linecap="round"/>
          <circle cx="40" cy="59" r="3.6" fill="#fff"/><circle cx="55" cy="63" r="2.8" fill="#e0f2fe"/>
        </svg>`;
      }
      if (mode === 'night') {
        return `<svg viewBox="0 0 80 80" fill="none">
          <path d="M51 47a19 19 0 0 1-23-25 20 20 0 1 0 27 27c-1.3-.4-2.7-1.1-4-2Z" fill="#fde68a"/>
          <circle cx="56" cy="24" r="2.6" fill="#fff"/><circle cx="62" cy="36" r="1.9" fill="#bae6fd"/>
        </svg>`;
      }
      if (mode === 'sunny') {
        return `<svg viewBox="0 0 80 80" fill="none">
          <circle cx="40" cy="40" r="16" fill="#fde047"/>
          <g stroke="#fde047" stroke-width="3.5" stroke-linecap="round">
            <path d="M40 12v6M40 62v6M12 40h6M62 40h6M20 20l4 4M56 56l4 4M60 20l-4 4M24 56l-4 4"/>
          </g>
        </svg>`;
      }
      return `<svg viewBox="0 0 80 80" fill="none">
        <circle cx="32" cy="32" r="12" fill="#fde047"/>
        <path d="M24 54h34a11 11 0 0 0 1.3-21.9A14 14 0 0 0 32.5 29 11 11 0 0 0 24 54Z" fill="#f1f5f9"/>
      </svg>`;
    }

    function applyTheme(mode) {
      const [t, m, b] = THEMES[mode] || THEMES.cloudy;
      document.documentElement.style.setProperty('--bg-top', t);
      document.documentElement.style.setProperty('--bg-mid', m);
      document.documentElement.style.setProperty('--bg-bot', b);
      state.fxMode = mode;
      initParticles();
    }

    function buildSimulatedData(scene) {
      const now = new Date();
      const presets = {
        snow:  { tempC: -3.4, feelsC: -8.8, wind: 22, label: 'Heavy Snowfall', rainP: 8, snowP: 94, rainMm: 0.1, snowCm: 9.2, mode: 'snow' },
        rain:  { tempC: 11.2, feelsC: 9.5, wind: 27, label: 'Steady Rainstorm', rainP: 90, snowP: 0, rainMm: 15.2, snowCm: 0, mode: 'rain' },
        mix:   { tempC: 0.5, feelsC: -3.5, wind: 19, label: 'Wintry Mix', rainP: 66, snowP: 62, rainMm: 5.4, snowCm: 3.3, mode: 'mix' },
        night: { tempC: 3.8, feelsC: 1.9, wind: 8, label: 'Clear Starry Night', rainP: 5, snowP: 0, rainMm: 0, snowCm: 0, mode: 'night' },
        sunny: { tempC: 20.0, feelsC: 19.6, wind: 10, label: 'Crisp & Sunny', rainP: 4, snowP: 0, rainMm: 0, snowCm: 0, mode: 'sunny' }
      };
      const p = presets[scene];
      const hours = Array.from({ length: 12 }, (_, i) => {
        const d = new Date(now.getTime() + i * 3600000);
        const wave = Math.sin((i + 1) * 0.55);
        return {
          label: i === 0 ? 'Now' : d.toLocaleTimeString([], { hour: 'numeric' }).replace(' ', ''),
          tempC: p.tempC + wave * 1.8,
          rainP: Math.max(0, Math.min(100, Math.round(p.rainP + wave * 14))),
          snowP: Math.max(0, Math.min(100, Math.round(p.snowP - wave * 12))),
          rainMm: Math.max(0, (p.rainMm / 6) * (0.6 + Math.abs(wave))),
          snowCm: Math.max(0, (p.snowCm / 6) * (0.6 + Math.abs(wave)))
        };
      });
      return { ...p, hours, updated: now };
    }

    async function autoDetectByIP() {
      try {
        const r = await fetch('https://get.geojs.io/v1/ip/geo.json');
        const j = await r.json();
        const lat = parseFloat(j.latitude), lon = parseFloat(j.longitude);
        if (Number.isFinite(lat) && Number.isFinite(lon)) {
          state.lat = lat;
          state.lon = lon;
          state.city = [j.city, j.region].filter(Boolean).join(', ') || 'My Location';
          localStorage.setItem('atmos_city', state.city);
          localStorage.setItem('atmos_lat', lat);
          localStorage.setItem('atmos_lon', lon);
          return true;
        }
      } catch {}
      return false;
    }

    async function fetchLiveWeather() {
      if (!state.city) {
        const ok = await autoDetectByIP();
        if (!ok) state.city = 'My Location';
      }
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${state.lat}&longitude=${state.lon}&current=temperature_2m,apparent_temperature,is_day,weather_code,wind_speed_10m,rain,snowfall&hourly=temperature_2m,precipitation_probability,rain,snowfall&forecast_days=2&timezone=auto`;
      try {
        const res = await fetch(url);
        const j = await res.json();
        const cur = j.current;
        const [label, baseMode] = WMO[cur.weather_code] || ['Cloudy', 'cloudy'];
        const mode = (baseMode === 'sunny' && cur.is_day === 0) ? 'night' : baseMode;

        const nowIso = cur.time.slice(0, 13);
        let startIdx = j.hourly.time.findIndex(t => t.startsWith(nowIso));
        if (startIdx < 0) startIdx = 0;

        const hours = [];
        let maxRainP = 0, maxSnowP = 0, sumRainMm = 0, sumSnowCm = 0;

        for (let i = 0; i < 12; i++) {
          const idx = startIdx + i;
          if (idx >= j.hourly.time.length) break;
          const tC = j.hourly.temperature_2m[idx];
          const prob = j.hourly.precipitation_probability[idx] || 0;
          const rMm = j.hourly.rain[idx] || 0;
          const sCm = j.hourly.snowfall[idx] || 0;

          let rainP = 0, snowP = 0;
          if (sCm > 0 && rMm > 0) {
            rainP = Math.round(prob * 0.65);
            snowP = Math.round(prob * 0.75);
          } else if (sCm > 0 || tC <= 0.5) {
            snowP = prob;
            rainP = tC > -1.0 ? Math.round(prob * 0.25) : 0;
          } else if (tC <= 2.5) {
            rainP = Math.round(prob * 0.75);
            snowP = Math.round(prob * 0.45);
          } else {
            rainP = prob;
            snowP = 0;
          }

          maxRainP = Math.max(maxRainP, rainP);
          maxSnowP = Math.max(maxSnowP, snowP);
          sumRainMm += rMm;
          sumSnowCm += sCm;

          const dt = new Date(j.hourly.time[idx]);
          hours.push({
            label: i === 0 ? 'Now' : dt.toLocaleTimeString([], { hour: 'numeric' }).replace(' ', ''),
            tempC: tC,
            rainP,
            snowP,
            rainMm: rMm,
            snowCm: sCm
          });
        }

        state.data = {
          tempC: cur.temperature_2m,
          feelsC: cur.apparent_temperature,
          wind: cur.wind_speed_10m,
          label,
          mode,
          rainP: maxRainP,
          snowP: maxSnowP,
          rainMm: sumRainMm,
          snowCm: sumSnowCm,
          hours,
          updated: new Date()
        };
        render();
      } catch {
        $('condLabel').textContent = 'Offline · Tap city to retry';
      }
    }

    function render() {
      const d = state.data;
      if (!d) return;

      $('cityName').textContent = state.sceneOverride === 'live' ? state.city : `${state.city} (Preview)`;
      $('unitBtn').textContent = '°' + state.unit;
      $('tempVal').textContent = toDisplayTemp(d.tempC);
      $('tempDeg').textContent = '°' + state.unit;
      $('condLabel').textContent = d.label;
      $('subMeta').textContent = `Feels ${toDisplayTemp(d.feelsC)}° · Wind ${fmtWind(d.wind)}`;
      $('heroIcon').innerHTML = iconSVG(d.mode);

      $('rainPct').textContent = d.rainP + '%';
      $('snowPct').textContent = d.snowP + '%';
      $('rainAmt').textContent = fmtRain(d.rainMm) + ' /12h';
      $('snowAmt').textContent = fmtSnow(d.snowCm) + ' /12h';
      $('rainBar').style.width = d.rainP + '%';
      $('snowBar').style.width = d.snowP + '%';
      $('updatedAt').textContent = d.updated.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      applyTheme(d.mode);

      const wrap = $('barsWrap');
      wrap.innerHTML = '';
      d.hours.forEach((h, i) => {
        const col = document.createElement('div');
        col.className = 'h-col' + (i === state.activeHour ? ' active' : '');
        const total = Math.max(h.rainP + h.snowP, 1);
        const cap = Math.min(100, Math.max(h.rainP, h.snowP));
        const snowH = h.snowP > 0 ? Math.round((h.snowP / total) * cap) : 0;
        const rainH = h.rainP > 0 ? Math.round((h.rainP / total) * cap) : 0;
        col.innerHTML = `
          <span class="h-temp">${toDisplayTemp(h.tempC)}°</span>
          <div class="h-bar-box">
            <div class="h-bar-snow" style="height:${snowH}%"></div>
            <div class="h-bar-rain" style="height:${rainH}%"></div>
          </div>
          <span class="h-time">${h.label}</span>
        `;
        col.onclick = () => {
          state.activeHour = i;
          renderInspector();
          document.querySelectorAll('.h-col').forEach((el, idx) => el.classList.toggle('active', idx === i));
        };
        wrap.appendChild(col);
      });
      renderInspector();
    }

    function renderInspector() {
      const h = state.data?.hours[state.activeHour];
      if (!h) return;
      $('inspector').firstElementChild.textContent = `${h.label}: Rain ${h.rainP}% · Snow ${h.snowP}% (${toDisplayTemp(h.tempC)}°)`;
    }

    const canvas = $('fxCanvas');
    const ctx = canvas.getContext('2d');
    let W = 0, H = 0;

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
      W = canvas.clientWidth;
      H = canvas.clientHeight;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      initParticles();
    }

    function initParticles() {
      state.particles = [];
      const mode = state.fxMode;
      const count = mode === 'snow' ? 75 : mode === 'rain' ? 90 : mode === 'mix' ? 85 : mode === 'night' ? 60 : 18;
      for (let i = 0; i < count; i++) {
        const depth = Math.random();
        state.particles.push({
          x: Math.random() * W,
          y: Math.random() * H,
          r: 1.0 + depth * 3.0,
          vx: (Math.random() - 0.5) * 0.85,
          vy: 1.1 + depth * 2.5,
          a: 0.25 + depth * 0.65,
          phase: Math.random() * Math.PI * 2,
          kind: mode === 'mix' ? (i % 2 === 0 ? 'snow' : 'rain') : mode
        });
      }
    }

    let tFrame = 0;
    function tick() {
      if (state.running) {
        tFrame += 0.016;
        ctx.clearRect(0, 0, W, H);

        if (state.fxMode === 'sunny') {
          const g = ctx.createRadialGradient(W * 0.86, H * 0.12, 8, W * 0.86, H * 0.12, Math.max(W, H) * 0.68);
          g.addColorStop(0, 'rgba(254, 240, 138, 0.36)');
          g.addColorStop(0.45, 'rgba(56, 189, 248, 0.09)');
          g.addColorStop(1, 'rgba(255, 255, 255, 0)');
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, W, H);
        } else if (state.fxMode === 'night') {
          const g = ctx.createLinearGradient(0, 0, W, H * 0.5);
          g.addColorStop(0, 'rgba(56, 189, 248, 0.1)');
          g.addColorStop(0.5, 'rgba(52, 211, 153, 0.08)');
          g.addColorStop(1, 'rgba(139, 92, 246, 0.06)');
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, W, H * 0.55);
        }

        for (const p of state.particles) {
          if (p.kind === 'snow') {
            p.y += p.vy * 0.44;
            p.x += Math.sin(tFrame * 1.4 + p.phase) * 0.55 + p.vx * 0.3;
            if (p.y > H + 8) { p.y = -8; p.x = Math.random() * W; }
            if (p.x > W + 8) p.x = -8;
            if (p.x < -8) p.x = W + 8;
            ctx.beginPath();
            ctx.fillStyle = `rgba(240, 249, 255, ${p.a})`;
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fill();
          } else if (p.kind === 'rain') {
            p.y += p.vy * 4.5;
            p.x -= 1.25;
            if (p.y > H + 20) { p.y = -20; p.x = Math.random() * (W + 40); }
            ctx.beginPath();
            ctx.strokeStyle = `rgba(125, 211, 252, ${p.a * 0.74})`;
            ctx.lineWidth = 1.35;
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p.x - 3.6, p.y + 14);
            ctx.stroke();
          } else if (p.kind === 'night') {
            const tw = 0.32 + 0.68 * Math.abs(Math.sin(tFrame * 1.7 + p.phase));
            ctx.beginPath();
            ctx.fillStyle = `rgba(255, 255, 255, ${p.a * tw})`;
            ctx.arc(p.x, p.y * 0.72, p.r * 0.45, 0, Math.PI * 2);
            ctx.fill();
          } else {
            p.x += 0.18;
            if (p.x > W + 65) p.x = -65;
            ctx.beginPath();
            ctx.fillStyle = `rgba(255, 255, 255, ${p.a * 0.08})`;
            ctx.arc(p.x, p.y * 0.6, p.r * 18, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }
      requestAnimationFrame(tick);
    }

    document.addEventListener('visibilitychange', () => {
      state.running = !document.hidden;
    });

    async function searchCity(q) {
      if (!q.trim()) return;
      const box = $('searchResults');
      box.innerHTML = '<div class="res-item">Searching...</div>';
      try {
        const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=5&language=en&format=json`);
        const j = await res.json();
        box.innerHTML = '';
        if (!j.results || !j.results.length) {
          box.innerHTML = '<div class="res-item">No cities found</div>';
          return;
        }
        j.results.forEach(r => {
          const btn = document.createElement('button');
          btn.className = 'res-item';
          const label = [r.name, r.admin1, r.country_code].filter(Boolean).join(', ');
          btn.textContent = label;
          btn.onclick = () => {
            state.city = label;
            state.lat = r.latitude;
            state.lon = r.longitude;
            state.sceneOverride = 'live';
            localStorage.setItem('atmos_city', label);
            localStorage.setItem('atmos_lat', r.latitude);
            localStorage.setItem('atmos_lon', r.longitude);
            updateSceneChips();
            $('modalBg').classList.remove('open');
            fetchLiveWeather();
          };
          box.appendChild(btn);
        });
      } catch {
        box.innerHTML = '<div class="res-item">Search unavailable offline</div>';
      }
    }

    async function useGPS() {
      $('cityName').textContent = 'Locating...';
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(async pos => {
          state.lat = pos.coords.latitude;
          state.lon = pos.coords.longitude;
          state.city = `${state.lat.toFixed(2)}, ${state.lon.toFixed(2)}`;
          try {
            const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${state.lat}&lon=${state.lon}`);
            const j = await r.json();
            const a = j.address || {};
            state.city = [a.city || a.town || a.village || a.county, a.state].filter(Boolean).join(', ') || state.city;
          } catch {}
          localStorage.setItem('atmos_city', state.city);
          localStorage.setItem('atmos_lat', state.lat);
          localStorage.setItem('atmos_lon', state.lon);
          state.sceneOverride = 'live';
          updateSceneChips();
          $('modalBg').classList.remove('open');
          fetchLiveWeather();
        }, async () => {
          await autoDetectByIP();
          $('modalBg').classList.remove('open');
          fetchLiveWeather();
        }, { timeout: 7000 });
      } else {
        await autoDetectByIP();
        $('modalBg').classList.remove('open');
        fetchLiveWeather();
      }
    }

    function updateSceneChips() {
      document.querySelectorAll('#sceneChips .chip').forEach(c => {
        c.classList.toggle('active', c.dataset.scene === state.sceneOverride);
      });
    }

    $('openSettings').onclick = () => $('modalBg').classList.add('open');
    $('closeModal').onclick = () => $('modalBg').classList.remove('open');
    $('modalBg').onclick = (e) => { if (e.target === $('modalBg')) $('modalBg').classList.remove('open'); };
    $('searchBtn').onclick = () => searchCity($('cityInput').value);
    $('cityInput').onkeydown = (e) => { if (e.key === 'Enter') searchCity($('cityInput').value); };
    $('gpsBtn').onclick = useGPS;
    $('refreshBtn').onclick = () => {
      if (state.sceneOverride === 'live') fetchLiveWeather();
      else { state.data = buildSimulatedData(state.sceneOverride); render(); }
    };
    $('unitBtn').onclick = () => {
      state.unit = state.unit === 'F' ? 'C' : 'F';
      localStorage.setItem('atmos_unit', state.unit);
      render();
    };
    document.querySelectorAll('#sceneChips .chip').forEach(chip => {
      chip.onclick = () => {
        state.sceneOverride = chip.dataset.scene;
        updateSceneChips();
        $('modalBg').classList.remove('open');
        if (state.sceneOverride === 'live') fetchLiveWeather();
        else { state.data = buildSimulatedData(state.sceneOverride); render(); }
      };
    });

    window.addEventListener('resize', resize);
    resize();
    tick();
    fetchLiveWeather();
    setInterval(() => { if (state.sceneOverride === 'live') fetchLiveWeather(); }, 900000);
  </script>
</body>
</html>
